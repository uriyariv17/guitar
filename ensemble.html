<style>
:root{
  --bg:#050608; --bg2:#0B0E13; --card:#10141B; --card2:#151A23; --line:rgba(255,244,227,.10);
  --ink:#FFF4E3; --ink2:rgba(255,244,227,.68); --cyan:#22D9F0; --orange:#FF9D1F; --gold:#F6C26B;
  --grad:linear-gradient(90deg, var(--cyan), var(--gold) 55%, var(--orange));
  color-scheme:dark;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; scroll-padding-top:70px; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } *{ animation:none !important; transition:none !important; } }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Heebo', Arial, sans-serif; font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom, 0px); }
img{ max-width:100%; display:block; }
a{ color:var(--cyan); }
.wrap{ max-width:1120px; margin:0 auto; padding:0 20px; }
h1, h2, h3{ font-family:'Secular One', 'Heebo', Arial, sans-serif; font-weight:400; line-height:1.15; margin:0; }
h2{ font-size:clamp(1.9rem, 4.6vw, 2.8rem); }
.kicker{ display:inline-flex; align-items:center; gap:10px; color:var(--gold); font-weight:700; letter-spacing:.06em; font-size:.88rem; margin-bottom:10px; }
.kicker::before{ content:''; width:28px; height:2px; background:var(--grad); border-radius:2px; }
.lead{ color:var(--ink2); font-size:1.12rem; max-width:62ch; }
section{ padding:88px 0; position:relative; }
section + section{ border-top:1px solid var(--line); }

/* nav */
.nav{ position:sticky; top:0; z-index:20; background:rgba(5,6,8,.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top, 0px); }
.nav .wrap{ display:flex; align-items:center; justify-content:space-between; gap:14px; height:62px; }
.brand{ font-family:'Secular One', sans-serif; font-size:1.5rem; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:10px; }
.brand svg{ width:44px; height:20px; }
.nav-links{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
.nav-links::-webkit-scrollbar{ display:none; }
.nav-links a{ color:var(--ink2); text-decoration:none; font-weight:500; padding:8px 12px; border-radius:999px; white-space:nowrap; font-size:.95rem; }
.nav-links a:hover{ color:var(--ink); background:rgba(255,255,255,.06); }
.nav .btn{ padding:9px 18px; font-size:.95rem; }
@media (max-width: 760px){ .nav-links{ display:none; } }

.btn{ appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:700 1rem 'Heebo', sans-serif; padding:14px 26px; border-radius:999px; text-decoration:none; color:#140B00; background:linear-gradient(90deg, var(--gold), var(--orange)); box-shadow:0 8px 28px rgba(255,157,31,.28); transition:transform .15s, box-shadow .15s; }
.btn:hover{ transform:translateY(-1px); box-shadow:0 10px 34px rgba(255,157,31,.4); }
.btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
.btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid rgba(34,217,240,.55); box-shadow:none; }
.btn.ghost:hover{ background:rgba(34,217,240,.08); }

/* hero */
.hero{ padding:56px 0 70px; text-align:center; overflow:hidden; position:relative; }
html, body{ overflow-x:clip; }
.hero::before{ content:''; position:absolute; inset:-10% -20% auto; height:520px; background:radial-gradient(closest-side at 22% 45%, rgba(34,217,240,.16), transparent 70%), radial-gradient(closest-side at 78% 45%, rgba(255,157,31,.16), transparent 70%); pointer-events:none; }
.hero .logo{ width:min(780px, 100%); margin:0 auto; position:relative; mix-blend-mode:screen; }
.hero h1{ font-size:clamp(1.5rem, 3.6vw, 2.2rem); margin-top:20px; position:relative; }
.hero p{ color:var(--ink2); max-width:56ch; margin:12px auto 26px; font-size:1.12rem; position:relative; }
.hero .ctas{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; position:relative; }
.pulse{ width:100%; height:60px; margin-top:30px; margin-bottom:-30px; }
.pulse path{ stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 3.2s ease-out .3s forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* about */
.about{ display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; }
@media (max-width: 860px){ .about{ grid-template-columns:1fr; } }
.about-card{ background:linear-gradient(160deg, rgba(34,217,240,.10), rgba(255,157,31,.08)); border:1px solid var(--line); border-radius:24px; padding:30px; }
.about-card ul{ list-style:none; margin:0; padding:0; display:grid; gap:14px; }
.about-card li{ display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; }
.about-card li::before{ content:''; width:10px; height:10px; margin-top:9px; border-radius:50%; background:var(--grad); box-shadow:0 0 12px rgba(34,217,240,.6); }

/* benefits */
.grid3{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px; margin-top:34px; }
@media (max-width: 900px){ .grid3{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width: 580px){ .grid3{ grid-template-columns:1fr; } }
.card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; position:relative; overflow:hidden; transition:border-color .2s, transform .2s; }
.card:hover{ border-color:rgba(246,194,107,.35); transform:translateY(-2px); }
.card .ic{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; margin-bottom:14px; }
.card .ic svg{ width:24px; height:24px; }
.card:nth-child(3n+1) .ic{ background:rgba(34,217,240,.12); color:var(--cyan); }
.card:nth-child(3n+2) .ic{ background:rgba(246,194,107,.12); color:var(--gold); }
.card:nth-child(3n) .ic{ background:rgba(255,157,31,.12); color:var(--orange); }
.card h3{ font-size:1.35rem; margin-bottom:6px; }
.card p{ color:var(--ink2); margin:0; }

/* mentors */
.mentors{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:22px; margin-top:34px; }
@media (max-width: 760px){ .mentors{ grid-template-columns:1fr; } }
.mentor{ display:grid; grid-template-columns:132px 1fr; gap:20px; align-items:start; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px; }
@media (max-width: 460px){ .mentor{ grid-template-columns:1fr; } }
.avatar{ width:132px; height:132px; border-radius:50%; position:relative; background:var(--card2); display:grid; place-items:center; overflow:hidden; }
.avatar::after{ content:''; position:absolute; inset:0; border-radius:50%; padding:3px; background:var(--grad); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.avatar .ph{ font-family:'Secular One', sans-serif; font-size:2.6rem; color:var(--gold); }
.mentor h3{ font-size:1.5rem; }
.mentor .role{ color:var(--cyan); font-weight:700; font-size:.95rem; margin:2px 0 8px; }
.mentor p{ color:var(--ink2); margin:0; white-space:pre-line; }

/* place */
.place{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:28px; }
@media (max-width: 760px){ .place{ grid-template-columns:1fr; } }
.info{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; display:grid; gap:6px; }
.info .lbl{ color:var(--gold); font-weight:700; font-size:.9rem; }
.info .big{ font-family:'Secular One', sans-serif; font-size:1.6rem; }
.info .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }

/* gallery */
.gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; margin-top:30px; }
.ph-tile{ aspect-ratio:4/3; border-radius:18px; overflow:hidden; background:var(--card); border:1px solid var(--line); position:relative; }
.ph-tile img{ width:100%; height:100%; object-fit:cover; transition:transform .4s; cursor:zoom-in; }
.ph-tile:hover img{ transform:scale(1.04); }
.ph-tile.empty{ display:grid; place-items:center; text-align:center; color:var(--ink2); font-size:.92rem; padding:18px; border-style:dashed; background:repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 12px, transparent 12px 24px); }
.ph-tile .cap{ position:absolute; inset:auto 0 0; padding:8px 12px; background:linear-gradient(transparent, rgba(0,0,0,.75)); font-size:.9rem; }
.lightbox{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:grid; place-items:center; padding:20px; cursor:zoom-out; }
.lightbox img{ max-height:90vh; border-radius:12px; }

/* form */
.form-box{ background:linear-gradient(170deg, rgba(34,217,240,.07), rgba(255,157,31,.06)); border:1px solid var(--line); border-radius:26px; padding:clamp(20px, 4vw, 38px); margin-top:30px; max-width:760px; }
.q{ display:grid; gap:6px; margin-bottom:18px; }
.q-label{ font-weight:700; }
.req{ color:var(--orange); margin-inline-start:4px; }
input[type=text], input[type=tel], input[type=email], input[type=number], textarea, select{ width:100%; font:inherit; color:var(--ink); background:rgba(0,0,0,.35); border:1px solid rgba(255,244,227,.18); border-radius:12px; padding:12px 14px; min-height:48px; }
textarea{ min-height:110px; resize:vertical; }
input::placeholder, textarea::placeholder{ color:rgba(255,244,227,.4); }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{ display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,244,227,.18); border-radius:999px; padding:8px 14px; cursor:pointer; user-select:none; }
.opt input{ accent-color:var(--orange); width:18px; height:18px; }
.opt:has(input:checked){ border-color:var(--orange); background:rgba(255,157,31,.12); }
.q-err{ color:#FF8A80; font-size:.9rem; min-height:0; }
.hp{ position:absolute; inset-inline-start:0; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); opacity:0; pointer-events:none; }
.done{ text-align:center; padding:30px 10px; }
.done h3{ font-size:2rem; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.form-msg{ color:#FF8A80; font-weight:600; margin-top:10px; }

/* contact */
.contact{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-top:28px; }
.cbtn{ display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; color:var(--ink); text-decoration:none; transition:border-color .2s; }
.cbtn:hover{ border-color:rgba(34,217,240,.5); }
.cbtn svg{ width:28px; height:28px; flex:none; }
.cbtn b{ display:block; }
.cbtn small{ color:var(--ink2); direction:ltr; display:block; text-align:right; }
footer{ padding:40px 0 60px; text-align:center; color:var(--ink2); font-size:.92rem; border-top:1px solid var(--line); }
footer .staff{ background:none; border:0; color:rgba(255,244,227,.35); font:inherit; font-size:.85rem; cursor:pointer; margin-top:10px; text-decoration:underline; }

/* reveal */
.rv{ opacity:0; transform:translateY(18px); transition:opacity .7s, transform .7s; }
.rv.in{ opacity:1; transform:none; }

/* edit mode */
body.editing [data-k]{ outline:1px dashed rgba(246,194,107,.55); outline-offset:4px; border-radius:6px; cursor:text; min-width:40px; }
body.editing [data-k]:focus{ outline:2px solid var(--gold); background:rgba(246,194,107,.06); }
body.editing [data-k]:empty::before{ content:attr(data-ph); color:rgba(255,244,227,.35); }
.edit-only{ display:none !important; }
body.editing .edit-only{ display:revert !important; }
body.editing .ed-flex{ display:flex !important; }
.edbar{ position:fixed; z-index:50; inset:auto 0 0; background:#111622; border-top:1px solid rgba(246,194,107,.4); padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
.edbar .st{ color:var(--ink2); font-size:.9rem; }
.mini{ appearance:none; border:1px solid rgba(255,244,227,.25); background:rgba(255,255,255,.04); color:var(--ink); font:600 .85rem 'Heebo', sans-serif; border-radius:999px; padding:6px 12px; cursor:pointer; }
.mini.danger{ border-color:rgba(255,120,110,.5); color:#FF9A90; }
.ph-tile .tile-acts{ position:absolute; top:8px; inset-inline-start:8px; display:flex; gap:6px; }
.fb{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:18px; display:grid; gap:10px; }
.fb-q{ display:grid; grid-template-columns:minmax(0,2fr) 140px auto auto; gap:8px; align-items:center; }
@media (max-width: 640px){ .fb-q{ grid-template-columns:1fr 1fr; } }
.fb-q .opts-in{ grid-column:1 / -1; }
.modal{ position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.7); display:grid; place-items:center; padding:20px; }
.modal-box{ background:#111622; border:1px solid var(--line); border-radius:20px; padding:24px; width:min(420px, 100%); display:grid; gap:12px; }
.toast{ position:fixed; z-index:80; inset:auto 0 90px; margin:0 auto; width:max-content; max-width:90vw; background:#1B2230; border:1px solid rgba(246,194,107,.5); padding:10px 18px; border-radius:999px; }
</style>

    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .84).split(',')[1]); };
    img.onerror = () => rej(new Error('לא הצלחתי לקרוא את התמונה.')); img.src = url;
  });
}
async function uploadImage(file, max){ const data = await resizeImage(file, max); const r = await call('landingUploadImage', Object.assign({name:file.name, mime:'image/jpeg', data}, EDIT)); return r.url; }
let photoTarget = null;
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]'); if(z && !EDIT){ const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = `<img src="${esc(D.photos[+z.dataset.zoom].url)}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; }
  const b = e.target.closest('[data-ed]'); if(!b || !EDIT) return;
  const act = b.dataset.ed, i = +b.dataset.i;
  if(act === 'add-do') D.doList.push('שורה חדשה');
  if(act === 'del-do') D.doList.splice(i, 1);
  if(act === 'add-ben') D.benefits.push({t:'כותרת', d:'תיאור קצר'});
  if(act === 'del-ben') D.benefits.splice(i, 1);
  if(act === 'q-add') D.form.questions.push({id:'q' + Date.now().toString(36), label:'שאלה חדשה', type:'text', required:false});
  if(act === 'q-del') D.form.questions.splice(i, 1);
  if(act === 'q-up' && i > 0) D.form.questions.splice(i - 1, 0, D.form.questions.splice(i, 1)[0]);
  if(act === 'q-down' && i < D.form.questions.length - 1) D.form.questions.splice(i + 1, 0, D.form.questions.splice(i, 1)[0]);
  if(act === 'ph-del'){ if(!confirm('למחוק את התמונה מהדף?')) return; D.photos.splice(i, 1); }
  if(act === 'ph-up' && i > 0) D.photos.splice(i - 1, 0, D.photos.splice(i, 1)[0]);
  if(act === 'ph-down' && i < D.photos.length - 1) D.photos.splice(i + 1, 0, D.photos.splice(i, 1)[0]);
  if(act === 'm-photo-del') D.mentors[i].photo = '';
  if(act === 'add-photo' || act === 'm-photo'){ photoTarget = act === 'm-photo' ? i : 'gallery'; const fi = $('#photoFile'); fi.multiple = photoTarget === 'gallery'; fi.click(); return; }
  markDirty(); render();
});
$('#photoFile').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; if(!files.length) return;
  const msg = $('#photoMsg');
  try{
    for(let k = 0; k < files.length; k++){
      msg.textContent = `מעלה תמונה ${k + 1} מתוך ${files.length}…`; if(photoTarget !== 'gallery') toast('מעלה תמונה…');
      const url = await uploadImage(files[k], photoTarget === 'gallery' ? 1600 : 600);
      if(photoTarget === 'gallery') D.photos.push({url, cap:''}); else D.mentors[photoTarget].photo = url;
    }
    msg.textContent = 'התמונות עלו. לא לשכוח לשמור.'; markDirty(); render();
  }catch(err){ msg.textContent = err.message; toast(err.message); }
});
document.addEventListener('input', e => {
  if(!EDIT) return;
  const k = e.target.closest('[data-k]'); if(k && k.isContentEditable){ const v = k.innerText.replace(/\n{3,}/g, '\n\n').trim(); if(k.dataset.k.includes('.')) setPath(k.dataset.k, v); else D[k.dataset.k] = v; markDirty(); if(k.dataset.k === 'place'){ const q = encodeURIComponent(v); $('#mapsLink').href = 'https://www.google.com/maps/search/?api=1&query=' + q; $('#wazeLink').href = 'https://waze.com/ul?q=' + q + '&navigate=yes'; } return; }
  const fq = e.target.closest('[data-fq]');
  if(fq){ const q = D.form.questions[+fq.closest('.fb-q').dataset.i], f = fq.dataset.fq; if(f === 'options') q.options = fq.value.split(',').map(x => x.trim()).filter(Boolean); else if(f !== 'required' && f !== 'type') q[f] = fq.value; markDirty(); renderForm(); return; }
  const fb = e.target.closest('[data-fb]'); if(fb && fb.type !== 'checkbox'){ D.form[fb.dataset.fb] = fb.value; markDirty(); return; }
  const ct = e.target.closest('[data-ct]'); if(ct){ D.contact[ct.dataset.ct] = ct.value.trim(); markDirty(); renderContact(); }
});
document.addEventListener('change', e => {
  if(!EDIT) return;
  const fq = e.target.closest('[data-fq]');
  if(fq && (fq.dataset.fq === 'type' || fq.dataset.fq === 'required')){ const q = D.form.questions[+fq.closest('.fb-q').dataset.i]; if(fq.dataset.fq === 'type'){ q.type = fq.value; if((q.type === 'single' || q.type === 'multi') && !(q.options || []).length) q.options = ['אפשרות 1', 'אפשרות 2']; } else q.required = fq.checked; markDirty(); renderBuilder(); renderForm(); }
  const fb = e.target.closest('[data-fb]'); if(fb && fb.type === 'checkbox'){ D.form.open = fb.checked; markDirty(); renderForm(); }
});
document.addEventListener('paste', e => { const k = e.target.closest && e.target.closest('[contenteditable="true"]'); if(!k) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); });
window.addEventListener('beforeunload', e => { if(EDIT && dirty){ e.preventDefault(); e.returnValue = ''; } });
/* ---- form submit ---- */
document.addEventListener('submit', async e => {
  if(e.target.id !== 'regForm') return; e.preventDefault();
  if(EDIT) return;
  const form = e.target, answers = []; let bad = null;
  $$('.q', form).forEach(el => {
    const q = D.form.questions[+el.dataset.i], err = $('.q-err', el); err.textContent = '';
    let v;
    if(q.type === 'single') v = ($('input:checked', el) || {}).value || '';
    else if(q.type === 'multi') v = $$('input:checked', el).map(x => x.value).join(', ');
    else v = ($('input, textarea', el).value || '').trim();
    if(q.required && !v){ err.textContent = 'צריך למלא את השדה הזה.'; bad = bad || el; }
    else if(v && q.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ err.textContent = 'כתובת המייל לא נראית תקינה.'; bad = bad || el; }
    else if(v && q.type === 'tel' && v.replace(/\D/g, '').length < 9){ err.textContent = 'מספר הטלפון קצר מדי.'; bad = bad || el; }
    answers.push({label:q.label, value:v});
  });
  if(bad){ bad.scrollIntoView({block:'center', behavior:'smooth'}); const f = $('input, textarea', bad); if(f) f.focus(); return; }
  const btn = $('button[type=submit]', form), msg = $('#formMsg'); btn.disabled = true; btn.textContent = 'שולח…'; msg.textContent = '';
  try{
    const r = await call('publicLandingSubmit', {answers, website:form.website.value});
    $('#formBox').innerHTML = `<div class="done"><h3>נרשמתם!</h3><p class="lead" style="margin:10px auto 0">${esc(r.message || D.form.success)}</p></div>`;
  }catch(err){ msg.textContent = err.message; btn.disabled = false; btn.textContent = 'שליחת הרשמה'; }
});
/* ---- staff login ---- */
$('#staffBtn').addEventListener('click', () => {
  if(EDIT) return;
  document.body.insertAdjacentHTML('beforeend', `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lgT"><form class="modal-box" id="lgF"><h3 id="lgT">כניסת צוות</h3><p style="color:var(--ink2);margin:0">סיסמת המורה, או קוד המנחה של ההרכבים הצעירים.</p><input type="password" id="lgP" autocomplete="current-password" aria-label="סיסמה או קוד"><p class="form-msg" id="lgE"></p><div style="display:flex;gap:10px"><button class="btn" type="submit">כניסה</button><button class="mini" type="button" id="lgC">ביטול</button></div></form></div>`);
  $('#lgP').focus();
  $('#lgC').onclick = () => $('.modal').remove();
  $('#lgF').onsubmit = async ev => {
    ev.preventDefault(); const v = $('#lgP').value.trim(); if(!v) return;
    const auth = /^\d{4,8}$/.test(v) ? {pin:v} : {password:v};
    try{ await call('landingAuthCheck', auth); $('.modal').remove(); enterEdit(auth); }
    catch(err){
      if(auth.pin){ try{ await call('landingAuthCheck', {password:v}); $('.modal').remove(); enterEdit({password:v}); return; }catch(e2){} }
      $('#lgE').textContent = err.message;
    }
  };
});
/* ---- reveal on scroll ---- */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold:.12}) : null;
function observe(){ $$('.rv:not(.in)').forEach(el => io ? io.observe(el) : el.classList.add('in')); }
async function load(){
  try{ const r = await call('publicLanding'); if(r.data) D = merge(JSON.parse(JSON.stringify(DEF)), r.data); }catch(e){ /* הדף עובד גם בלי שרת, עם הטקסטים ההתחלתיים */ }
  render(); observe();
}
(async () => {
  await load();
  let saved = null; try{ saved = JSON.parse(sessionStorage.getItem('tedder.auth') || 'null'); }catch(e){}
  if(!saved){ try{ const tp = localStorage.getItem('pritah.tpw') || sessionStorage.getItem('pritah.tpw'); if(tp && new URLSearchParams(location.search).has('edit')) saved = {password:tp}; }catch(e){} }
  if(saved){ try{ await call('landingAuthCheck', saved); enterEdit(saved); }catch(e){} }
})();
</script>
